<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" role="img" aria-label="Lucioles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE8B8"/>
      <stop offset="55%" stop-color="#FFC145"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </radialGradient>
  </defs>
  <g transform="translate(4 6)">
    <circle cx="30" cy="30" r="29" fill="url(#glow)"/>
    <circle cx="30" cy="30" r="29" fill="none" stroke="#FF6B5B" stroke-width="1.5" opacity=".35"/>
    <!-- firefly body -->
    <ellipse cx="26" cy="33" rx="7.5" ry="6" fill="#2A2140"/>
    <circle cx="35.5" cy="33" r="4.2" fill="#2A2140"/>
