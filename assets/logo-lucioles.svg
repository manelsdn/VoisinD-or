    <path d="M20 28c-2-3-4-4-6-4" fill="none" stroke="#2A2140" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="12.5" cy="23" r="1.6" fill="#FFF8F0"/>
    <circle cx="6" cy="47" r="1.6" fill="#FFF8F0" opacity=".9"/>
    <circle cx="13" cy="43" r="1.2" fill="#FFF8F0" opacity=".7"/>
